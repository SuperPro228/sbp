<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Axiom Trading Terminal</title>
<style>
  :root { --bg: #0a0a0a; --panel: #1c1c1e; --text: #ffffff; --muted: #8e8e93; --green: #30d158; --red: #ff453a; --blue: #0a84ff; }
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  body { background: var(--bg); color: var(--text); display: flex; justify-content: center; min-height: 100vh; }
  .app { width: 100%; max-width: 500px; padding: 20px; display: flex; flex-direction: column; gap: 15px; }
  
  /* Шапка */
  .term-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .back-btn { background: none; border: 1px solid #333; color: var(--blue); padding: 8px 15px; border-radius: 8px; font-size: 14px; cursor: pointer; text-decoration: none; }
  
  /* Панель выбора монеты */
  .pair-selector { background: var(--panel); padding: 15px; border-radius: 12px; display: flex; gap: 10px; align-items: center; }
  .pair-selector select { background: #2c2c2e; color: white; border: 1px solid #444; padding: 10px; border-radius: 8px; font-size: 16px; outline: none; flex: 1; cursor: pointer; }

  /* График */
  .chart-box { height: 300px; background: var(--panel); border-radius: 12px; position: relative; overflow: hidden; }
  canvas { width: 100%; height: 100%; display: block; }
  .price-label { position: absolute; top: 15px; left: 15px; font-size: 24px; font-weight: bold; }
  
  /* Статистика */
  .term-stats { display: flex; justify-content: space-between; background: var(--panel); padding: 15px; border-radius: 12px; }
  .term-stat { display: flex; flex-direction: column; gap: 5px; }
  .term-stat-lbl { font-size: 12px; color: var(--muted); }
  .term-stat-val { font-size: 18px; font-weight: bold; }

  /* Ввод суммы */
  .amount-input { background: var(--panel); padding: 15px; border-radius: 12px; display: flex; align-items: center; gap: 10px; }
  .amount-input input { background: none; border: none; color: white; font-size: 20px; font-weight: bold; width: 100%; outline: none; }
  .amount-input span { color: var(--muted); font-size: 14px; }
  
  /* Кнопки */
  .trade-panel { display: flex; gap: 10px; }
  .trade-btn { flex: 1; padding: 15px; border: none; border-radius: 12px; font-size: 16px; font-weight: bold; color: white; cursor: pointer; }
  .btn-buy { background: var(--green); }
  .btn-sell { background: var(--red); }

  /* Уведомления */
  #toast { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); background: rgba(255,255,255,0.1); backdrop-filter: blur(10px); padding: 12px 24px; border-radius: 20px; font-size: 14px; opacity: 0; transition: 0.3s; pointer-events: none; text-align: center; }
</style>
</head>
<body>
<div id="toast"></div>

<div class="app">
  <div class="term-header">
    <a href="prop.html" class="back-btn">← Назад</a>
    <div style="font-weight:bold;" id="acc-title">Загрузка...</div>
  </div>

  <!-- Выбор монеты -->
  <div class="pair-selector">
    <select id="pair-select" onchange="changePair()">
      <option value="SOLUSDT">SOL/USDT</option>
      <option value="BTCUSDT">BTC/USDT</option>
      <option value="ETHUSDT">ETH/USDT</option>
      <option value="GAZP">GAZP (Акции)</option>
    </select>
  </div>

  <!-- График -->
  <div class="chart-box">
    <div class="price-label" id="price-display" style="color: var(--blue);">$0.00</div>
    <canvas id="cv"></canvas>
  </div>

  <div class="term-stats">
    <div class="term-stat">
      <span class="term-stat-lbl">Баланс</span>
      <span class="term-stat-val" id="acc-balance">$0</span>
    </div>
    <div class="term-stat">
      <span class="term-stat-lbl">PnL (в реальном времени)</span>
      <span class="term-stat-val" id="acc-pnl" style="color:var(--muted);">0%</span>
    </div>
  </div>

  <div class="amount-input">
    <input type="number" id="trade-amount" placeholder="Сумма" value="100">
    <span>USD</span>
  </div>

  <div class="trade-panel">
    <button class="trade-btn btn-buy" onclick="trade('buy')">BUY / LONG</button>
    <button class="trade-btn btn-sell" onclick="trade('sell')">SELL / SHORT</button>
  </div>
</div>

<script>
  let accounts = [];
  let currentAccount = null;
  let activePosition = null;
  let currentPrice = 0;
  let priceHistory = [];
  
  // Настройки цен и волатильности для каждой пары
  const pairsConfig = {
    'SOLUSDT': { base: 150.00, vol: 1.5, prefix: '$', dec: 2, name: 'SOL/USDT' },
    'BTCUSDT': { base: 65015.40, vol: 100, prefix: '$', dec: 2, name: 'BTC/USDT' },
    'ETHUSDT': { base: 3500.00, vol: 10, prefix: '$', dec: 2, name: 'ETH/USDT' },
    'GAZP': { base: 111.85, vol: 0.3, prefix: '', dec: 2, name: 'GAZP' }
  };
  let activePair = 'SOLUSDT';

  window.onload = () => {
    // 1. Проверка авторизации
    const session = localStorage.getItem('user_session');
    if (!session) {
      alert("Вы не вошли в аккаунт!");
      window.location.href = 'prop.html';
      return;
    }

    // 2. Получаем ID счета из ссылки (которую мы передали из prop.html)
    const urlParams = new URLSearchParams(window.location.search);
    const accountId = urlParams.get('id');

    accounts = JSON.parse(localStorage.getItem('my_prop_accounts')) || [];
    
    if (accounts.length === 0) {
      alert("У вас нет купленных счетов!");
      window.location.href = 'prop.html';
      return;
    }

    // 3. Ищем нужный счет, если передан ID. Если нет — берем первый.
    if (accountId) {
      currentAccount = accounts.find(a => a.id === accountId);
    } else {
      currentAccount = accounts[0];
    }

    if (!currentAccount) {
      alert("Счет не найден!");
      window.location.href = 'prop.html';
      return;
    }

    document.getElementById('acc-title').innerText = `Счет: $${currentAccount.size.toLocaleString()}`;
    
    // 4. Запуск графика
    resetChart(activePair);
    updateUI();
    resizeCanvas();
    setInterval(updatePrice, 1000);
  };

  // Смена монеты
  function changePair() {
    if (activePosition) {
      alert("Сначала закройте сделку!");
      document.getElementById('pair-select').value = activePair;
      return;
    }
    activePair = document.getElementById('pair-select').value;
    resetChart(activePair);
  }

  function resetChart(pair) {
    const config = pairsConfig[pair];
    currentPrice = config.base;
    priceHistory = Array(50).fill(currentPrice);
    updatePriceLabel();
    drawChart();
    updateUI();
  }

  function updatePriceLabel() {
    const config = pairsConfig[activePair];
    const priceStr = config.prefix + currentPrice.toFixed(config.dec) + (activePair === 'GAZP' ? ' ₽' : '');
    document.getElementById('price-display').innerText = priceStr;
  }

  function updatePrice() {
    const config = pairsConfig[activePair];
    const change = (Math.random() - 0.5) * config.vol;
    currentPrice = Math.max(0.1, currentPrice + change);
    
    priceHistory.push(currentPrice);
    if (priceHistory.length > 50) priceHistory.shift();

    updatePriceLabel();
    if (activePosition) updateUI(); 
    drawChart();
  }

  function updateUI() {
    if (!currentAccount) return;

    let displayBalance = currentAccount.currentBalance;
    let pnlPercent = ((displayBalance - currentAccount.initialBalance) / currentAccount.initialBalance) * 100;

    if (activePosition) {
      const floatingPnl = activePosition.type === 'buy' 
        ? (currentPrice - activePosition.entryPrice) * activePosition.size
        : (activePosition.entryPrice - currentPrice) * activePosition.size;
      
      displayBalance += floatingPnl;
      pnlPercent = ((displayBalance - currentAccount.initialBalance) / currentAccount.initialBalance) * 100;
    }

    document.getElementById('acc-balance').innerText = `$${displayBalance.toFixed(2)}`;
    
    const pnlEl = document.getElementById('acc-pnl');
    pnlEl.innerText = (pnlPercent > 0 ? '+' : '') + pnlPercent.toFixed(2) + '%';
    pnlEl.style.color = pnlPercent > 0 ? 'var(--green)' : pnlPercent < 0 ? 'var(--red)' : 'var(--muted)';
  }

  // Логика торговли
  function trade(type) {
    const investAmount = parseFloat(document.getElementById('trade-amount').value);

    if (isNaN(investAmount) || investAmount <= 0) {
      showToast("Введите сумму!");
      return;
    }

    if (activePosition) {
      // Закрытие позиции
      let finalPnl = activePosition.type === 'buy' 
        ? (currentPrice - activePosition.entryPrice) * activePosition.size 
        : (activePosition.entryPrice - currentPrice) * activePosition.size;
      
      // Комиссия 0.05%
      finalPnl -= investAmount * 0.0005;

      currentAccount.currentBalance += finalPnl;
      
      const idx = accounts.findIndex(a => a.id === currentAccount.id);
      accounts[idx] = currentAccount;
      localStorage.setItem('my_prop_accounts', JSON.stringify(accounts));

      showToast(`Сделка закрыта. PnL: ${finalPnl > 0 ? '+' : ''}$${finalPnl.toFixed(2)}`);
      activePosition = null;
    } else {
      // Открытие позиции
      if (investAmount > currentAccount.currentBalance) {
        showToast("Недостаточно средств!");
        return;
      }

      activePosition = { 
        type: type, 
        entryPrice: currentPrice, 
        size: investAmount / currentPrice 
      };
      showToast(`Открыта позиция ${type === 'buy' ? 'LONG' : 'SHORT'} на $${investAmount}`);
    }

    updateUI();
    drawChart();
  }

  // --- График ---
  const cv = document.getElementById('cv');
  const ctx = cv.getContext('2d');

  function resizeCanvas() {
    if(!cv.parentElement) return;
    cv.width = cv.parentElement.clientWidth;
    cv.height = cv.parentElement.clientHeight;
    drawChart();
  }
  window.addEventListener('resize', resizeCanvas);

  function drawChart() {
    if(!ctx || priceHistory.length === 0) return;
    ctx.clearRect(0, 0, cv.width, cv.height);
    
    // Сетка
    ctx.strokeStyle = '#2a2e39';
    ctx.lineWidth = 1;
    ctx.beginPath();
    for(let i=0; i<cv.height; i+=40) { ctx.moveTo(0, i); ctx.lineTo(cv.width, i); }
    for(let i=0; i<cv.width; i+=60) { ctx.moveTo(i, 0); ctx.lineTo(i, cv.height); }
    ctx.stroke();

    const mx = Math.max(...priceHistory), mn = Math.min(...priceHistory);
    const rng = mx - mn || 1;
    
    // Линия
    ctx.beginPath();
    ctx.strokeStyle = activePosition 
      ? (activePosition.type === 'buy' ? '#30d158' : '#ff453a') 
      : '#0a84ff';
    ctx.lineWidth = 2;

    priceHistory.forEach((p, i) => {
      const x = (i / (priceHistory.length - 1)) * cv.width;
      const y = cv.height - ((p - mn) / rng) * cv.height * 0.8 - 20;
      i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
    });
    ctx.stroke();

    // Заливка
    ctx.lineTo(cv.width, cv.height); ctx.lineTo(0, cv.height); ctx.closePath();
    const g = ctx.createLinearGradient(0, 0, 0, cv.height);
    g.addColorStop(0, activePosition ? (activePosition.type === 'buy' ? 'rgba(48,209,88,0.2)' : 'rgba(255,69,58,0.2)') : 'rgba(10,132,255,0.2)');
    g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = g; ctx.fill();
  }

  function showToast(msg) {
    const t = document.getElementById('toast');
    t.innerText = msg;
    t.style.opacity = '1';
    setTimeout(() => t.style.opacity = '0', 2500);
  }
</script>
</body>
</html>
