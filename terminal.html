<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Axiom Trading Terminal</title>
<style>
  :root { --bg: #0a0a0a; --panel: #1c1c1e; --text: #ffffff; --muted: #8e8e93; --green: #30d158; --red: #ff453a; --blue: #0a84ff; }
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  body { background: var(--bg); color: var(--text); display: flex; justify-content: center; min-height: 100vh; }
  .app { width: 100%; max-width: 500px; padding: 20px; display: flex; flex-direction: column; gap: 15px; }
  
  /* Шапка */
  .term-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .back-btn { background: none; border: 1px solid #333; color: var(--blue); padding: 8px 15px; border-radius: 8px; font-size: 14px; cursor: pointer; text-decoration: none; }
  
  /* Выбор аккаунта */
  .account-selector { background: var(--panel); padding: 15px; border-radius: 12px; display: flex; flex-direction: column; gap: 10px; }
  .account-selector label { font-size: 12px; color: var(--muted); }
  .account-selector select { background: #2c2c2e; color: white; border: 1px solid #444; padding: 10px; border-radius: 8px; font-size: 16px; outline: none; }

  /* График */
  .chart-box { height: 250px; background: var(--panel); border-radius: 12px; position: relative; overflow: hidden; }
  canvas { width: 100%; height: 100%; display: block; }
  
  /* Статистика */
  .term-stats { display: flex; justify-content: space-between; background: var(--panel); padding: 15px; border-radius: 12px; }
  .term-stat { display: flex; flex-direction: column; gap: 5px; }
  .term-stat-lbl { font-size: 12px; color: var(--muted); }
  .term-stat-val { font-size: 18px; font-weight: bold; }
  
  /* Кнопки */
  .trade-panel { display: flex; gap: 10px; }
  .trade-btn { flex: 1; padding: 15px; border: none; border-radius: 12px; font-size: 16px; font-weight: bold; color: white; cursor: pointer; }
  .btn-buy { background: var(--green); }
  .btn-sell { background: var(--red); }

  /* Уведомления */
  #toast { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); background: rgba(255,255,255,0.1); backdrop-filter: blur(10px); padding: 12px 24px; border-radius: 20px; font-size: 14px; opacity: 0; transition: 0.3s; pointer-events: none; text-align: center; }
</style>
</head>
<body>
<div id="toast"></div>

<div class="app">
  <div class="term-header">
    <a href="prop.html" class="back-btn">← Назад</a>
    <div style="font-weight:bold;">Axiom Terminal</div>
  </div>

  <div class="account-selector">
    <label>Выберите счет для торговли:</label>
    <select id="account-dropdown" onchange="switchAccount()">
      <!-- Заполняется через JS -->
    </select>
  </div>

  <div class="chart-box">
    <canvas id="cv"></canvas>
  </div>

  <div class="term-stats">
    <div class="term-stat">
      <span class="term-stat-lbl">Баланс</span>
      <span class="term-stat-val" id="acc-balance">$0</span>
    </div>
    <div class="term-stat">
      <span class="term-stat-lbl">PnL</span>
      <span class="term-stat-val" id="acc-pnl" style="color:var(--muted);">0%</span>
    </div>
  </div>

  <div class="trade-panel">
    <button class="trade-btn btn-buy" onclick="trade('buy')">BUY</button>
    <button class="trade-btn btn-sell" onclick="trade('sell')">SELL</button>
  </div>
</div>

<script>
  let accounts = [];
  let activeAccountIndex = 0;
  let activePosition = null;
  let currentPrice = 100.00;
  let priceHistory = Array(40).fill(100.00);
  
  // Загрузка при старте
  window.onload = () => {
    // 1. Проверка авторизации (сессии)
    const session = localStorage.getItem('user_session');
    if (!session) {
      alert("Вы не вошли в аккаунт! Перенаправление...");
      window.location.href = 'prop.html';
      return;
    }

    // 2. Загрузка купленных счетов
    accounts = JSON.parse(localStorage.getItem('my_prop_accounts')) || [];
    
    if (accounts.length === 0) {
      alert("У вас нет купленных счетов! Сначала купите счет.");
      window.location.href = 'prop.html';
      return;
    }

    // 3. Заполнение выпадающего списка
    const dropdown = document.getElementById('account-dropdown');
    dropdown.innerHTML = '';
    accounts.forEach((acc, index) => {
      const option = document.createElement('option');
      option.value = index;
      option.innerText = `Счет $${acc.size.toLocaleString()} (Баланс: $${acc.currentBalance.toFixed(2)})`;
      dropdown.appendChild(option);
    });

    // 4. Запуск движка графика
    updateUI();
    resizeCanvas();
    setInterval(updatePrice, 1000); // Движение цены каждую секунду
  };

  // Переключение между счетами
  window.switchAccount = () => {
    const dropdown = document.getElementById('account-dropdown');
    activeAccountIndex = parseInt(dropdown.value);
    activePosition = null; // Сбрасываем сделку при смене счета
    currentPrice = 100.00;
    priceHistory = Array(40).fill(100.00);
    
    updateUI();
    drawChart();
    showToast(`Переключено на счет $${accounts[activeAccountIndex].size.toLocaleString()}`);
  };

  // Обновление баланса и PnL на экране
  function updateUI() {
    const acc = accounts[activeAccountIndex];
    if (!acc) return;

    document.getElementById('acc-balance').innerText = `$${acc.currentBalance.toFixed(2)}`;
    
    const pnlPercent = ((acc.currentBalance - acc.initialBalance) / acc.initialBalance) * 100;
    const pnlEl = document.getElementById('acc-pnl');
    pnlEl.innerText = (pnlPercent > 0 ? '+' : '') + pnlPercent.toFixed(2) + '%';
    pnlEl.style.color = pnlPercent > 0 ? '#30d158' : pnlPercent < 0 ? '#ff453a' : '#8e8e93';
  }

  // Логика торговли
  window.trade = (type) => {
    const acc = accounts[activeAccountIndex];

    if (activePosition) {
      // Закрытие позиции
      let pnl = activePosition.type === 'buy' 
        ? (currentPrice - activePosition.entry) * activePosition.size 
        : (activePosition.entry - currentPrice) * activePosition.size;
      
      acc.currentBalance += pnl;
      acc.currentBalance -= Math.abs(pnl) * 0.05; // Комиссия 5%
      
      // Сохраняем новый баланс в память
      localStorage.setItem('my_prop_accounts', JSON.stringify(accounts));
      
      showToast(`Сделка закрыта. PnL: $${pnl.toFixed(2)}`);
      activePosition = null;
    } else {
      // Открытие позиции (риск 1% от счета)
      const riskAmount = acc.initialBalance * 0.01; 
      activePosition = { type, entry: currentPrice, size: riskAmount };
      showToast(`Открыта позиция ${type.toUpperCase()}`);
    }
    
    updateUI();
    drawChart();
  };

  // --- Движок графика ---
  const cv = document.getElementById('cv');
  const ctx = cv.getContext('2d');

  function resizeCanvas() {
    if(!cv.parentElement) return;
    cv.width = cv.parentElement.clientWidth;
    cv.height = cv.parentElement.clientHeight;
    drawChart();
  }
  window.addEventListener('resize', resizeCanvas);

  function updatePrice() {
    const change = (Math.random() - 0.5) * 2;
    currentPrice = Math.max(1, currentPrice + change);
    priceHistory.push(currentPrice);
    if (priceHistory.length > 40) priceHistory.shift();

    if (activePosition) updateUI(); // Обновляем PnL в реальном времени
    drawChart();
  }

  function drawChart() {
    if(!ctx) return;
    ctx.clearRect(0, 0, cv.width, cv.height);
    const mx = Math.max(...priceHistory), mn = Math.min(...priceHistory);
    const rng = mx - mn || 1;
    
    ctx.beginPath();
    ctx.strokeStyle = activePosition ? (activePosition.type === 'buy' ? '#30d158' : '#ff453a') : '#0a84ff';
    ctx.lineWidth = 2;

    priceHistory.forEach((p, i) => {
      const x = (i / (priceHistory.length - 1)) * cv.width;
      const y = cv.height - ((p - mn) / rng) * cv.height;
      i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
    });
    ctx.stroke();

    // Заливка под графиком
    ctx.lineTo(cv.width, cv.height); ctx.lineTo(0, cv.height); ctx.closePath();
    const g = ctx.createLinearGradient(0, 0, 0, cv.height);
    g.addColorStop(0, activePosition ? 'rgba(48,209,88,0.2)' : 'rgba(10,132,255,0.2)');
    g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = g; ctx.fill();
  }

  function showToast(msg) {
    const t = document.getElementById('toast');
    t.innerText = msg;
    t.style.opacity = '1';
    setTimeout(() => t.style.opacity = '0', 2000);
  }
</script>
</body>
</html>
