<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Axiom Terminal</title>
<style>
  /* Возвращаем темную тему как было */
  :root { --bg: #0a0a0a; --panel: #1c1c1e; --text: #ffffff; --muted: #8e8e93; --green: #30d158; --red: #ff453a; --blue: #0a84ff; }
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  body { background: var(--bg); color: var(--text); display: flex; justify-content: center; min-height: 100vh; }
  .app { width: 100%; max-width: 700px; padding: 20px; display: flex; flex-direction: column; gap: 15px; }
  
  /* Шапка терминала */
  .term-header { display: flex; justify-content: space-between; align-items: center; }
  .back-btn { background: none; border: 1px solid #333; color: var(--blue); padding: 8px 15px; border-radius: 8px; font-size: 14px; cursor: pointer; text-decoration: none; }
  
  /* Панель выбора монеты */
  .top-panel { display: flex; gap: 15px; background: var(--panel); padding: 15px; border-radius: 12px; align-items: center; }
  .top-panel select { background: #2c2c2e; color: white; border: 1px solid #444; padding: 10px 15px; border-radius: 8px; font-size: 16px; font-weight: bold; outline: none; cursor: pointer; }
  .top-panel .info { display: flex; flex-direction: column; }
  .top-panel .info span { font-size: 12px; color: var(--muted); }
  .top-panel .info b { font-size: 18px; }

  /* График */
  .chart-box { height: 350px; background: var(--panel); border-radius: 12px; position: relative; overflow: hidden; }
  canvas { width: 100%; height: 100%; display: block; }
  .current-price { position: absolute; top: 20px; left: 20px; font-size: 32px; font-weight: bold; z-index: 10; }
  
  /* Статистика */
  .term-stats { display: flex; justify-content: space-between; background: var(--panel); padding: 15px 20px; border-radius: 12px; }
  .term-stat { display: flex; flex-direction: column; gap: 5px; }
  .term-stat-lbl { font-size: 12px; color: var(--muted); }
  .term-stat-val { font-size: 20px; font-weight: bold; }
  
  /* Панель управления сделкой */
  .trade-panel { background: var(--panel); padding: 20px; border-radius: 12px; display: flex; gap: 15px; align-items: center; }
  .trade-panel input { flex: 1; background: #2c2c2e; border: 1px solid #444; color: white; padding: 15px; border-radius: 10px; font-size: 18px; font-weight: bold; outline: none; }
  .btn-trade { padding: 15px 30px; border: none; border-radius: 10px; font-size: 16px; font-weight: bold; color: white; cursor: pointer; transition: 0.2s; }
  .btn-buy { background: var(--green); }
  .btn-sell { background: var(--red); }
  .btn-buy:hover { background: #28b84c; }
  .btn-sell:hover { background: #e03e33; }

  /* Уведомления */
  #toast { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); background: rgba(255,255,255,0.1); backdrop-filter: blur(10px); padding: 15px 30px; border-radius: 20px; font-size: 16px; font-weight: bold; opacity: 0; transition: 0.3s; pointer-events: none; text-align: center; }
</style>
</head>
<body>
<div id="toast"></div>

<div class="app">
  <div class="term-header">
    <a href="prop.html" class="back-btn">← Назад в магазин</a>
    <div style="font-weight:bold;" id="acc-title">Загрузка...</div>
  </div>

  <!-- Выбор пары (как в TradingView) -->
  <div class="top-panel">
    <select id="pair-select" onchange="changePair()">
      <option value="SOLUSDT">SOL/USDT</option>
      <option value="BTCUSDT">BTC/USDT</option>
      <option value="ETHUSDT">ETH/USDT</option>
      <option value="GAZP">GAZP (Российские акции)</option>
    </select>
    <div class="info">
      <span>Текущая цена</span>
      <b id="price-info">0.00</b>
    </div>
  </div>

  <!-- График -->
  <div class="chart-box">
    <div class="current-price" id="price-display" style="color: var(--blue);">0.00</div>
    <canvas id="cv"></canvas>
  </div>

  <!-- Статистика -->
  <div class="term-stats">
    <div class="term-stat">
      <span class="term-stat-lbl">Баланс счета</span>
      <span class="term-stat-val" id="acc-balance">$0</span>
    </div>
    <div class="term-stat">
      <span class="term-stat-lbl">PnL (Плавающий)</span>
      <span class="term-stat-val" id="acc-pnl" style="color:var(--muted);">0%</span>
    </div>
  </div>

  <!-- Панель ордера -->
  <div class="trade-panel">
    <input type="number" id="trade-amount" placeholder="Сумма в $" value="100">
    <button class="btn-trade btn-buy" onclick="openTrade('buy')">BUY / LONG</button>
    <button class="btn-trade btn-sell" onclick="openTrade('sell')">SELL / SHORT</button>
  </div>
</div>

<script>
  // --- 1. Состояние ---
  let accounts = [];
  let currentAccount = null;
  let activePosition = null;
  let currentPrice = 0;
  let priceHistory = [];
  
  // Настройки для монет (стартовая цена и волатильность)
  const pairsConfig = {
    'SOLUSDT': { base: 150.00, vol: 2.5, prefix: '$', dec: 2 },
    'BTCUSDT': { base: 65000.00, vol: 150, prefix: '$', dec: 0 },
    'ETHUSDT': { base: 3500.00, vol: 15, prefix: '$', dec: 2 },
    'GAZP': { base: 111.85, vol: 0.5, prefix: '', dec: 2 } // Как на твоем скрине
  };
  let activePair = 'SOLUSDT';

  window.onload = () => {
    // Получаем ID счета из ссылки
    const urlParams = new URLSearchParams(window.location.search);
    const accountId = urlParams.get('id');

    if (!accountId) { alert("Ошибка: Не выбран счет!"); window.location.href = 'prop.html'; return; }

    accounts = JSON.parse(localStorage.getItem('my_prop_accounts')) || [];
    currentAccount = accounts.find(a => a.id === accountId);

    if (!currentAccount) { alert("Счет не найден!"); window.location.href = 'prop.html'; return; }

    document.getElementById('acc-title').innerText = `Счет: $${currentAccount.size.toLocaleString()}`;
    
    // Инициализируем график
    resetChart(activePair);
    
    updateUI();
    resizeCanvas();
    setInterval(updatePrice, 1000);
  };

  // --- 2. Логика смены монеты ---
  function changePair() {
    if (activePosition) {
      alert("Сначала закройте текущую сделку (нажмите на ту же кнопку, на которую открывали)!");
      document.getElementById('pair-select').value = activePair;
      return;
    }
    activePair = document.getElementById('pair-select').value;
    resetChart(activePair);
    showToast(`Загружен график ${activePair}`);
  }

  function resetChart(pair) {
    const config = pairsConfig[pair];
    currentPrice = config.base;
    priceHistory = Array(40).fill(currentPrice);
    
    // Обновляем текст цены
    const priceStr = config.prefix + currentPrice.toFixed(config.dec) + (pair === 'GAZP' ? ' ₽' : '');
    document.getElementById('price-display').innerText = priceStr;
    document.getElementById('price-info').innerText = priceStr;

    drawChart();
    updateUI();
  }

  // --- 3. Генерация цены и обновление UI ---
  function updatePrice() {
    const config = pairsConfig[activePair];
    
    // Случайное блуждание
    const change = (Math.random() - 0.5) * config.vol;
    currentPrice = Math.max(0.1, currentPrice + change);
    
    priceHistory.push(currentPrice);
    if (priceHistory.length > 40) priceHistory.shift();

    const priceStr = config.prefix + currentPrice.toFixed(config.dec) + (activePair === 'GAZP' ? ' ₽' : '');
    document.getElementById('price-display').innerText = priceStr;
    document.getElementById('price-info').innerText = priceStr;

    if (activePosition) {
      updateUI(); // Обновляем PnL, если сделка открыта
    }
    
    drawChart();
  }

  function updateUI() {
    if (!currentAccount) return;

    let displayBalance = currentAccount.currentBalance;
    let pnlPercent = ((displayBalance - currentAccount.initialBalance) / currentAccount.initialBalance) * 100;

    if (activePosition) {
      // Считаем плавающий убыток/прибыль
      const floatingPnl = activePosition.type === 'buy' 
        ? (currentPrice - activePosition.entryPrice) * activePosition.size
        : (activePosition.entryPrice - currentPrice) * activePosition.size;
      
      displayBalance += floatingPnl;
      pnlPercent = ((displayBalance - currentAccount.initialBalance) / currentAccount.initialBalance) * 100;
    }

    document.getElementById('acc-balance').innerText = `$${displayBalance.toFixed(2)}`;
    
    const pnlEl = document.getElementById('acc-pnl');
    pnlEl.innerText = (pnlPercent > 0 ? '+' : '') + pnlPercent.toFixed(2) + '%';
    pnlEl.style.color = pnlPercent > 0 ? 'var(--green)' : pnlPercent < 0 ? 'var(--red)' : 'var(--muted)';
  }

  // --- 4. Открытие/Закрытие сделки ---
  function openTrade(type) {
    const amountInput = document.getElementById('trade-amount');
    const investAmount = parseFloat(amountInput.value);

    if (isNaN(investAmount) || investAmount <= 0) { showToast("Введите сумму!"); return; }

    if (activePosition) {
      // ЗАКРЫТИЕ СДЕЛКИ
      let finalPnl = activePosition.type === 'buy' 
        ? (currentPrice - activePosition.entryPrice) * activePosition.size 
        : (activePosition.entryPrice - currentPrice) * activePosition.size;
      
      // Комиссия 0.05% от суммы сделки
      finalPnl -= investAmount * 0.0005; 

      currentAccount.currentBalance += finalPnl;
      
      // Сохраняем обновленный баланс
      const idx = accounts.findIndex(a => a.id === currentAccount.id);
      accounts[idx] = currentAccount;
      localStorage.setItem('my_prop_accounts', JSON.stringify(accounts));

      showToast(`Сделка закрыта. Ваш PnL: ${finalPnl > 0 ? '+' : ''}$${finalPnl.toFixed(2)}`);
      activePosition = null;
      
    } else {
      // ОТКРЫТИЕ СДЕЛКИ
      if (investAmount > currentAccount.currentBalance) {
        showToast("Недостаточно средств на счете!");
        return;
      }

      activePosition = { 
        type: type, 
        entryPrice: currentPrice, 
        size: investAmount / currentPrice 
      };
      
      showToast(`Открыта сделка ${type.toUpperCase()} на $${investAmount}`);
    }

    updateUI();
    drawChart();
  }

  // --- 5. Отрисовка графика ---
  const cv = document.getElementById('cv');
  const ctx = cv.getContext('2d');

  function resizeCanvas() {
    if(!cv.parentElement) return;
    cv.width = cv.parentElement.clientWidth;
    cv.height = cv.parentElement.clientHeight;
    drawChart();
  }
  window.addEventListener('resize', resizeCanvas);

  function drawChart() {
    if(!ctx || priceHistory.length === 0) return;
    ctx.clearRect(0, 0, cv.width, cv.height);
    
    const mx = Math.max(...priceHistory);
    const mn = Math.min(...priceHistory);
    const rng = mx - mn || 1;
    
    // Цвет линии: зеленый/красный если сделка открыта, иначе синий
    ctx.beginPath();
    ctx.strokeStyle = activePosition 
      ? (activePosition.type === 'buy' ? '#30d158' : '#ff453a') 
      : '#0a84ff';
    ctx.lineWidth = 3;

    priceHistory.forEach((p, i) => {
      const x = (i / (priceHistory.length - 1)) * cv.width;
      const y = cv.height - ((p - mn) / rng) * cv.height;
      i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
    });
    ctx.stroke();

    // Градиентная заливка под графиком
    ctx.lineTo(cv.width, cv.height); 
    ctx.lineTo(0, cv.height); 
    ctx.closePath();
    const g = ctx.createLinearGradient(0, 0, 0, cv.height);
    g.addColorStop(0, activePosition ? 'rgba(48,209,88,0.2)' : 'rgba(10,132,255,0.2)');
    g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = g; 
    ctx.fill();
  }

  function showToast(msg) {
    const t = document.getElementById('toast');
    t.innerText = msg;
    t.style.opacity = '1';
    setTimeout(() => t.style.opacity = '0', 3000);
  }
</script>
</body>
</html>
